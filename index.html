<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#08090a" />
    <meta name="description" content="The Last Beacon - Offline Survival and Navigation System" />
    <title>THE LAST BEACON</title>
  </head>
  <body class="bg-wasteland-950 text-wasteland-200">
    <div id="root"></div>
    <script>
      // Clear any legacy Service Worker or stale Workbox caches in development
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
